# ==========================================================
# OhmGuard altyapi servisleri
# ==========================================================
# PostgreSQL BURADA YOK: uygulama, host'ta kurulu yerel PostgreSQL'e
# (localhost:5432) baglanir. Bu compose yalnizca uygulamanin ihtiyac
# duydugu diger hazir servisleri ayaga kaldirir:
#   - kafka     : telemetri mesaj kuyrugu
#   - zookeeper : Kafka'nin ihtiyac duydugu koordinasyon servisi
#   - mailhog   : yerel SMTP (uygulama mailleri buraya gonderir, UI: 8025)
#
# Apache Ignite de BURADA YOK; Core uygulamasinin ICINE gomulu (embedded)
# calisir.
#
# Calistirmak icin:  docker compose up -d
# ==========================================================

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ohmguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ohmguard-kafka
    depends_on:
      - zookeeper
    ports:
      # Host'taki uygulama buradan baglanir: bootstrap-servers=localhost:9092
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Icerideki container'lar kafka:29092, host'taki uygulama localhost:9092 kullanir.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ohmguard-mailhog
    ports:
      # 1025 = SMTP (uygulama buraya mail gonderir), 8025 = web arayuzu
      - "1025:1025"
      - "8025:8025"
