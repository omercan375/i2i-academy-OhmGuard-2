spring.application.name=i2i-academy-ohmGuard-2

spring.config.import=optional:file:./config/secret.properties

# Ohm Guard Web App (SPA), proje kokundeki frontend/ klasorunden servis edilir
spring.web.resources.static-locations=file:./frontend/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/


# ==========================================================
# PostgreSQL
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ohmguard_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================================
# JWT
# ==========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:315360000000}


# ==========================================================
# Kafka
# ==========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


# Kafka Consumer
spring.kafka.consumer.group-id=ohmguard-telemetry-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.i2iacademyohmguard2.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.i2iacademyohmguard2.kafka.TelemetryMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false


# ==========================================================
# Kafka Topic isimleri
# ==========================================================

# TelemetryConsumer bunu kullan?yor
app.kafka.telemetry-topic=ohmguard.telemetry

# KafkaTopicConfig bunu kullan?yor
voltwise.kafka.telemetry-topic=ohmguard.telemetry

# Registration topic
voltwise.kafka.registration-topic=${KAFKA_REGISTRATION_TOPIC:voltwise.asset.registration}


# ==========================================================
# Gemini
# ==========================================================

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}


# ==========================================================
# Mail (SMTP) - docker-compose'daki MailHog'a gonderir
# ==========================================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:ohmguard@ohmguard.local}